name: Pilote SEO hebdomadaire

# Chaque lundi : relevés Search Console, GA4, Clarity (et Trends le 1er lundi du mois),
# enregistrés dans seo-pilot/data/. L'agence SEO elle-même (seo-pilot/PROMPT.md et
# .claude/agents/) tourne ensuite en routine Claude sur claude.ai, une heure plus tard,
# avec l'abonnement de Maxens : elle lit ces relevés, corrige, contrôle et met en ligne.
on:
  schedule:
    # 2 h UTC = 3 h à Paris en hiver, 4 h en été : tout est fait au réveil de Maxens.
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: seo-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci

      - name: Relevé Search Console
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: node scripts/seo-pilot-data.mjs

      # Ce que font les visiteurs sur les pages. Clarity peut être indisponible, ce n'est pas bloquant.
      - name: Relevé Clarity
        continue-on-error: true
        env:
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: node scripts/seo-pilot-clarity.mjs

      # Le 1er lundi du mois seulement : nourrit la revue éditoriale. Trends peut refuser, ce n'est pas bloquant.
      - name: Relevé Google Trends (1er lundi du mois)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 1' }}
        continue-on-error: true
        run: |
          if [ "$(date -u +%-d)" -le 7 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/seo-pilot-trends.mjs
          fi

      - name: Enregistrer les relevés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seo-pilot/data
          git diff --cached --quiet && exit 0
          git commit -m "chore(seo-pilot): relevés du $(date -u +%F) [skip ci]"
          git pull --rebase
          git push

      - name: Alerte Telegram en cas d'échec
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="❌ Agence SEO · $(date -u +%d/%m) : le relevé des données a échoué, l'agence travaillera sur les chiffres de la semaine dernière. Détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
