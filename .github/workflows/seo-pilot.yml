name: Pilote SEO hebdomadaire

# Chaque lundi : relevé Search Console, puis Claude choisit et applique jusqu'à
# 3 corrections (seo-pilot/PROMPT.md). Les contrôles du site doivent passer
# avant la mise en ligne ; le compte rendu part sur Telegram.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: seo-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci && npm install -g @anthropic-ai/claude-code

      - name: Relevé Search Console
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/seo-pilot-data.mjs

      - name: Pilote (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          rm -f seo-pilot/last-report.md
          claude -p "$(cat seo-pilot/PROMPT.md)" \
            --model claude-opus-5-5 \
            --max-turns 80 \
            --permission-mode acceptEdits \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run seo:check),Bash(npm run blog:build),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(ls:*),Bash(grep:*),Bash(python3:*)"

      - name: Garde-fous
        run: |
          # Fichiers que le pilote n'a pas le droit de modifier (avant le versionnage, qui touche CSS/JS).
          forbidden=$(git status --porcelain | awk '{print $2}' | grep -E '^(vercel\.json|\.github/|scripts/|assets/css/|assets/js/|index\.html|en/index\.html|llms)' || true)
          if [ -n "$forbidden" ]; then
            echo "Fichiers interdits modifiés :"; echo "$forbidden"; exit 1
          fi
          if git status --porcelain | grep -qE '^ ?D'; then
            echo "Le pilote a supprimé un fichier."; exit 1
          fi
          test -s seo-pilot/last-report.md

      - name: Versionner, dater et contrôler
        run: |
          node scripts/version-assets.mjs
          node scripts/update-lastmod.mjs
          npm run seo:check

      - name: Mettre en ligne
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(seo-pilot): corrections du $(date -u +%F)"
          git pull --rebase
          git push

      - name: Compte rendu Telegram
        if: success()
        run: |
          head -c 3800 seo-pilot/last-report.md > /tmp/report.txt
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text@/tmp/report.txt > /dev/null

      - name: Alerte Telegram en cas d'échec
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="Pilote SEO : échec du passage de cette semaine, rien n'a été mis en ligne. Détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
