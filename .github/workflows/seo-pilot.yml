name: Pilote SEO hebdomadaire

# Chaque lundi : relevé Search Console, puis l'agence SEO (chef de projet
# seo-pilot/PROMPT.md et agents .claude/agents/) applique jusqu'à 3 corrections
# et publie 1 article. Les contrôles du site doivent passer
# avant la mise en ligne ; le compte rendu part sur Telegram.
on:
  schedule:
    # 2 h UTC = 3 h à Paris en hiver, 4 h en été : tout est fait au réveil de Maxens.
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: seo-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci && npm install -g @anthropic-ai/claude-code

      - name: Relevé Search Console
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: node scripts/seo-pilot-data.mjs

      # Le 1er lundi du mois seulement : nourrit la revue éditoriale. Trends peut refuser, ce n'est pas bloquant.
      - name: Relevé Google Trends (1er lundi du mois)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 1' }}
        continue-on-error: true
        run: |
          if [ "$(date -u +%-d)" -le 7 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/seo-pilot-trends.mjs
          fi

      - name: "Agence SEO (Claude : chef de projet et ses agents)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          rm -f seo-pilot/last-report.md
          claude -p "$(cat seo-pilot/PROMPT.md)" \
            --model claude-opus-5-5 \
            --max-turns 200 \
            --permission-mode acceptEdits \
            --allowedTools "Agent,Task,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(npm run seo:check),Bash(npm run blog:build),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git checkout -- *),Bash(git clean -f -- blog/*),Bash(ls:*),Bash(grep:*),Bash(python3:*),Bash(curl -s https://www.googleapis.com/pagespeedonline/*)"

      - name: Garde-fous
        run: |
          # Fichiers que le pilote n'a pas le droit de modifier (avant le versionnage, qui touche CSS/JS).
          forbidden=$(git status --porcelain | awk '{print $2}' | grep -E '^(vercel\.json|\.github/|scripts/|assets/css/|assets/js/|index\.html|en/index\.html|llms)' || true)
          if [ -n "$forbidden" ]; then
            echo "Fichiers interdits modifiés :"; echo "$forbidden"; exit 1
          fi
          if git status --porcelain | grep -qE '^ ?D'; then
            echo "Le pilote a supprimé un fichier."; exit 1
          fi
          test -s seo-pilot/last-report.md

      - name: Versionner, dater et contrôler
        run: |
          node scripts/version-assets.mjs
          node scripts/update-lastmod.mjs
          npm run seo:check

      - name: Mettre en ligne
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(seo-pilot): corrections du $(date -u +%F)"
          git pull --rebase
          git push

      - name: Compte rendu Telegram
        if: success()
        run: |
          head -c 1500 seo-pilot/last-report.md > /tmp/report.txt
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text@/tmp/report.txt > /dev/null

      - name: Alerte Telegram en cas d'échec
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="❌ Agence SEO · $(date -u +%d/%m) : le passage a échoué, rien n'a été mis en ligne. Le site n'a pas bougé. Détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
