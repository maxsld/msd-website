name: Weekly Site Report (Telegram)

# Chaque samedi : comportement des visiteurs (GA4 + Search Console), analysé
# par Claude avec des actions proposées, envoyé sur Telegram.
on:
  schedule:
    # Samedi 07:17 UTC (09:17 Paris en été, 08:17 en hiver).
    - cron: "17 7 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Afficher le rapport dans les logs sans l'envoyer sur Telegram"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run weekly site report
        run: node scripts/weekly-site-report.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
