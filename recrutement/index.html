  <style>
    :root {
      --bg: #000;
      --text: #f6f6f6;
      --muted: #b7b7b7;
      --line: rgba(255, 255, 255, 0.18);
      --chip: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      letter-spacing: -0.02em;
      display: grid;
      place-items: center;
      padding: 2.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      width: min(920px, 94vw);
      height: 390px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.07) 35%, rgba(255, 255, 255, 0) 75%);
      filter: blur(36px);
      pointer-events: none;
      z-index: 0;
    }

    .recruitment {
      width: min(1000px, 100%);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .recruitment__logo {
      width: 72px;
      height: auto;
      margin: 0 auto 1.1rem;
      filter: invert(1) brightness(1.9);
      display: block;
      margin-bottom: 4rem;
    }

    .recruitment h1 {
      font-size: clamp(1.65rem, 5vw, 4rem);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.05em;
      margin-bottom: 3rem;
    }

    .chips {
      display: flex;
      justify-content: center;
      gap: 0.55rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }

    .chip {
      display: inline-flex;
      border: 1px solid var(--line);
      padding: .6rem 1.2rem;
      border-radius: 999px;
      background: var(--chip);
      color: #fff;
      font-family: "Inter", sans-serif;
      font-size: 0.86rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
    }

    .chip.is-active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .form {
      text-align: left;
      max-width: 700px;
      margin: 0 auto;
    }

    .field {
      display: grid;
      gap: 0.45rem;
      margin-bottom: 0.82rem;
    }

    .field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.82rem;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0.78rem;
      background: transparent;
      color: #fff;
      font: inherit;
      padding: 0.75rem 0.82rem;
      outline: none;
    }

    .field textarea {
      min-height: 130px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: rgba(255, 255, 255, 0.45);
      font-weight: 400;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(255, 255, 255, 0.45);
    }

    .submit {
      margin-top: 0.25rem;
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #000;
      font: inherit;
      font-size: 0.94rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      cursor: pointer;
    }

    @media (max-width: 680px) {
      .field-row {
        grid-template-columns: 1fr;
      }
    }
  </style>

<!-- Tracking — chargé uniquement après consentement cookie -->
<script>
function _msdLoadTracking(){
  // MSD Analytics
  (function(){
    var sid=sessionStorage.getItem('_msd')||Math.random().toString(36).slice(2);
    sessionStorage.setItem('_msd',sid);
    var t=Date.now();
    var iv;
    function send(d){
      var p={url:location.href,referrer:document.referrer,session_id:sid,duration_seconds:Math.round(d/1000)};
      var ok=false;
      try { ok=navigator.sendBeacon('https://app.msd-media.com/api/track',JSON.stringify(p)); } catch(e) {}
      if(!ok){
        fetch('https://app.msd-media.com/api/track',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(p),
          keepalive:true
        }).catch(function(){});
      }
    }
    function start(){
      if(iv) return;
      iv=setInterval(function(){send(Date.now()-t);},15000);
    }
    function stop(){
      if(!iv) return;
      clearInterval(iv);
      iv=undefined;
    }
    document.addEventListener('visibilitychange',function(){
      if(document.visibilityState==='hidden'){send(Date.now()-t);stop();}
      else{t=Date.now();send(0);start();}
    });
    send(0);
    start();
    // Scroll heatmap tracking
    (function(){
      var path=location.pathname;
      var scrollEvts=[];
      var lastPct=0;
      var pauseTimer=null;
      function getPct(){return Math.round((window.scrollY/(document.body.scrollHeight-window.innerHeight||1))*100);}
      function bucket(p){return Math.floor(p/5)*5;}
      function flush(){
        if(!scrollEvts.length)return;
        var evts=scrollEvts.splice(0);
        navigator.sendBeacon('https://app.msd-media.com/api/track-scroll',JSON.stringify({session_id:sid,path:path,events:evts}));
      }
      window.addEventListener('scroll',function(){
        var pct=getPct();
        if(Math.abs(pct-lastPct)>10&&pct<lastPct){scrollEvts.push({type:'backtrack',pct:bucket(pct)});}
        lastPct=pct;
        if(pauseTimer)clearTimeout(pauseTimer);
        pauseTimer=setTimeout(function(){scrollEvts.push({type:'pause',pct:bucket(pct)});flush();},1500);
      },{passive:true});
      window.addEventListener('beforeunload',function(){scrollEvts.push({type:'exit',pct:bucket(getPct())});flush();});
      setInterval(flush,30000);
    })();
  })();
  // Google Analytics (GA4)
  (function(){
    var s=document.createElement('script');
    s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id=G-VKSH9YQXZS';
    document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    window.gtag=gtag;
    gtag('js',new Date());
    gtag('config','G-VKSH9YQXZS');
  })();
}
(function(){
  var consent=localStorage.getItem('msd_cookie_consent');
  if(consent==='accepted'){_msdLoadTracking();return;}
  if(consent==='refused'){return;}
  if(window.innerWidth<=680){_msdLoadTracking();return;}
  function init(){
  var banner=document.getElementById('cookie-consent');
  if(!banner)return;
  function show(){banner.hidden=false;}
  function hide(){banner.hidden=true;}
  show();
  document.getElementById('cookie-accept').addEventListener('click',function(){
    localStorage.setItem('msd_cookie_consent','accepted');
    hide();
    _msdLoadTracking();
  });
  document.getElementById('cookie-refuse').addEventListener('click',function(){
    localStorage.setItem('msd_cookie_consent','refused');
    hide();
  });
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
})();
</script>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P28B6QRF"

  <div class="cookie-consent" id="cookie-consent" role="dialog" aria-label="Consentement cookies" hidden>
    <div class="cookie-consent__inner">
      <p class="cookie-consent__text">Nous utilisons des cookies pour mesurer l'audience du site et améliorer votre expérience. <a href="https://msd-media.com/terms/politique-confidentialite.html" target="_blank">En savoir plus</a></p>
      <div class="cookie-consent__actions">
        <button type="button" class="cookie-consent__btn cookie-consent__btn--refuse" id="cookie-refuse">Refuser</button>
        <button type="button" class="cookie-consent__btn cookie-consent__btn--accept" id="cookie-accept">Accepter</button>
      </div>
    </div>
  </div>

  <main class="recruitment">
    <img height="151" width="372" src="https://msd-media.com/assets/img/logo-black.webp" alt="MSD Media" class="recruitment__logo" loading="lazy" decoding="async">
    <h1>Recrutement MSD Media</h1>
    <div class="chips" aria-label="Postes ouverts">
      <button type="button" class="chip is-active" data-offer="Setter (commercial)">Setter (commercial)</button>
      <button type="button" class="chip" data-offer="Candidature spontanée">Candidature spontanée</button>
    </div>

    <form class="form" action="https://formspree.io/f/mkopvwap" method="POST">
      <input type="hidden" name="_subject" value="Candidature recrutement" />
      <div class="field">
        <select id="poste" name="poste" required>
          <option value="Setter (commercial)" selected>Offre : Setter (commercial)</option>
          <option value="Candidature spontanée">Offre : Candidature spontanée</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <input id="nom" name="nom" type="text" required placeholder="Nom *" />
        </div>
        <div class="field">
          <input id="whatsapp" name="whatsapp" type="tel" required placeholder="WhatsApp *" />
        </div>
      </div>

      <div class="field">
        <input id="portfolio" name="portfolio" type="url" placeholder="Lien vers votre portfolio / LinkedIn" />
      </div>

      <div class="field">
        <textarea id="motivations" name="motivations" required placeholder="Quelles sont vos motivations pour rejoindre MSD Media ? *"></textarea>
      </div>

      <button type="submit" class="submit">Envoyer ma candidature</button>
    </form>
  </main>
  <script>
    (function () {
      const chips = Array.from(document.querySelectorAll('.chip[data-offer]'));
      const offerSelect = document.getElementById('poste');
      if (!chips.length || !offerSelect) return;

      chips.forEach((chip) => {
        chip.addEventListener('click', () => {
          const offer = chip.dataset.offer || '';
          offerSelect.value = offer;
          chips.forEach((c) => c.classList.toggle('is-active', c === chip));
        });
      });

      offerSelect.addEventListener('change', () => {
        const offer = offerSelect.value;
        chips.forEach((chip) => {
          chip.classList.toggle('is-active', chip.dataset.offer === offer);
        });
      });
    })();
  </script>
